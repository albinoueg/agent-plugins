  - id: "frontend"
    tag: "[frontend]"
    tag_aliases:
      - "[frontend]"
      - "[Frontend]"
      - "[front-end]"
    title: "Criação de funcionalidade de usabilidade no front end."
    section_id: "sessao-3"
    description: "Envolve a criação completa da funcionalidade no lado cliente."
    professional_profile: "Desenvolvedor Web-Perfl 2.1 (full stack) ou Perfl 2.2 (front end) ou Desenvolvedor Delphi."
    deliverable: >-
      Código da implementação incorporado ao sistema e adicionado ao
      repositório, ou sistema de controle de versão.
    unit_of_measure: "Quantidade de funcionalidade."
    ust:
      base_value: 4
      warranty_value: 0
      raw_text: "4 por funcionalidade."
      calculation_type: "per_unit"
      block_size: null
      unit_parameter: "quantidade_funcionalidades_frontend"
      formula_description: "UST_total = 4 * quantidade_funcionalidades_frontend_criadas"
    complexity_rules:
      - level: "Altíssima"
        condition: "para funcionalidades com necessidade de negócio complexa."
        metric: "complexidade_negocio_frontend"
        threshold_description: "Necessidade de negócio complexa devidamente justificada na tarefa e refletida no código"
    validation_guidelines:
      requires_git_evidence: "required"
      requires_prior_authorization: false
      is_exceptional: false
      primary_evidence_sources:
        - "gitlab_commits_diffs"
        - "redmine_issue"
      expected_artifacts:
        - "Commits e diffs no GitLab demonstrando a criação completa de nova tela/componente/funcionalidade client-side"
      llm_audit_checklist:
        - "Analisar nos diffs do GitLab se houve criação completa de funcionalidade no lado cliente (Web ou Mobile/Flutter). Contabilizar 1 UM por item funcional novo com lógica própria (ex.: método de carga paginada/controle de estado no controller, widget com lógica condicional de estados/grade/paginação, menu de navegação com regra própria, ou enum novo com métodos de conversão = 1 UM por commit)."
        - "NÃO CONTABILIZAR ([desconsiderado] — 0 UM): funções gatilho de 1 linha (verMais, verMenos, aplicarFiltro, limparFiltro), páginas que apenas disparam initState e repassam ao controller, widgets puramente visuais/estáticos sem lógica condicional, modelos (fromJson/toJson/copyWith), interfaces, módulos de DI/rotas, helpers que só montam URL/query params e serviços simulados/mocks (*ServiceSimulado)."
        - "VERIFICAÇÃO DE SERVIÇO SIMULADO/MOCK: Se a tela/funcionalidade injetar serviço simulado (ex.: FormulariosServiceSimulado) em vez do serviço REST real, alertar que a entrega está incompleta e recomendar manter a tarefa 'Em andamento' até o commit que conecta o serviço real."
        - "VEDAÇÃO DE MISTURA DE CATÁLOGOS: Se a tarefa de criação ([frontend]) também alterar método/função criada em subtarefa anterior (ex.: parametrizar carregarFormularios já existente), separar essa alteração em uma subtarefa irmã de [frontend-alteracao]."
        - "Conferir se todos os caminhos de arquivos citados na nota batem exatamente com o new_path do diff (sem omitir pastas do módulo) e se a quantidade de seções 'Unidade elementar N' na nota coincide com o campo 'Unid. Medida (Cast)'."
        - "Atenção para não enquadrar como [frontend] (4 UST) o que for apenas adição de filtro simples, ordenação simples, validação simples de formulário ou alteração de tela existente — tais casos pertencem a [frontend-alteracao] (1 UST)."

