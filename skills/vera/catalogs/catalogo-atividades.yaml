# =============================================================================
# VERA — Catálogo Estruturado de Atividades (Repertório de Estimativas)
# =============================================================================
# Fonte Normativa: ANEXO I — CATÁLOGO DE ATIVIDADES - (Repertório de Estimativas)
#                  + Entendimento Acordado Economia & CAST
# Schema de Validação: ./catalog.schema.json
# Formato otimizado para leitura direta por LLMs e validação determinística.
# =============================================================================

schema_version: "1.2.0"

catalog_metadata:
  id: "catalogo-atividades-anexo-i"
  title: "CATÁLOGO DE ATIVIDADES"
  subtitle: "Repertório de Estimativas (Economia & CAST)"
  source_document: "ANEXO I — CATÁLOGO DE ATIVIDADES - (Repertório de Estimativas) e Entendimentos Acordados Economia/CAST"
  currency_unit: "UST"
  is_exhaustive: false
  introductory_note: >-
    O Catálogo de Serviços foi, em sua maioria, concebido por subprocesso da
    Engenharia de Software. Devido a constante mudança tecnológica e a
    diversidade de serviços de TI existentes, o rol das atividades descritas
    no catálogo não é exaustivo.

sources_of_truth_hierarchy:
  - priority: 1
    source: "Catálogo contratual de atividades/UST vigente"
    rule: "Unidade de medida, produto exigido, valores de UST e restrições formais do catálogo têm precedência máxima."
  - priority: 2
    source: "Entendimentos e regras específicas comprovadas entre Economia e CAST"
    rule: "Regras acordadas para interpretação de unidades elementares CRUD, operações acessórias, enums, garantia, reuso e aceitação."
  - priority: 3
    source: "Demanda/Issue e critérios de aceitação no Redmine"
    rule: "Escopo funcional solicitado, histórico de notas, anexos e apontamentos registrados na tarefa."
  - priority: 4
    source: "Diff real do Git (GitLab ou repositório local) e arquivos de contexto"
    rule: "Alterações materiais de código (interfaces, DTOs, implementações, testes, controladores e configurações)."
  - priority: 5
    source: "Exemplos históricos aprovados"
    rule: "Utilizados apenas como referência de estilo e formatação de evidências, nunca para contrariar o catálogo ou as regras acordadas."

global_validation_rules:
  strict_catalog_adherence: >-
    Todo enquadramento deve utilizar exclusivamente as tags, descrições,
    unidades de medida e valores de UST definidos neste catálogo. É vedado
    inventar códigos, extrapolar faixas ou atribuir UST sem o entregável
    (Produto) exigido. A saída da VERA é sempre uma proposta auditável e nunca
    deve ser tratada como faturamento automaticamente aprovado.
  warranty_zero_cost_rule: >-
    Conforme definido na atividade [problema], caso seja detectado que um
    problema reportado se trata de garantia contratual, tanto a tarefa de
    verificação quanto todas as tarefas relacionadas à sua correção devem ser
    tratadas como garantia, com custo zero (0 UST).
  prior_authorization_rule: >-
    Atividades marcadas com requires_prior_authorization: true ([avaliacao-squad],
    [Documento] e [Parecer-técnico]) exigem comprovação explícita de autorização
    prévia. Na ausência dessa evidência, classificar como INFORMACAO_AUSENTE.
  enum_per_commit_rule: >-
    Para um mesmo commit, se houver a criação ([backend]) ou alteração
    ([backend-alteracao]) de um ou mais enums, deve ser contabilizada 1 UM por
    commit (na respectiva categoria). Se houver 1 ou 10 enums criados ou
    alterados no mesmo commit, sempre será contabilizado somente 1 UM. Caso
    enums sejam criados/alterados em commits diferentes, cada commit com
    criação/alteração de enum contabilizará 1 UM na respectiva categoria.
  recurrence_in_same_demand_rule: >-
    Sempre que a mesma operação, funcionalidade ou método for cobrado mais de
    uma vez em commits distintos dentro da mesma demanda do Redmine: (1)
    perguntar obrigatoriamente ao usuário se a recorrência deve ser cobrada
    novamente (1 UM) ou desconsiderada ([desconsiderado] — 0 UM); (2) sugerir
    uma justificativa técnica concisa baseada no git diff; e (3) caso aprovada
    a nova cobrança, exigir a inclusão explícita de '(Justificativa: <motivo
    resumido da nova alteração>)' no item correspondente.
  hunk_deduplication_rule: >-
    Múltiplas alterações (vários hunks de diff) dentro da mesma unidade
    elementar/método ou dentro do mesmo arquivo de configuração/template no
    mesmo escopo contam como 1 única Unidade de Medida (1 UM).
  category_plus_um_comparison_rule: >-
    Na auditoria entre o faturamento previsto (GitLab) e o realizado (Redmine),
    o confronto é realizado estritamente em nível de Categoria (tag) +
    Quantidade de Unidades de Medida (UM), e não apenas no total consolidado de
    UST. Divergências de categoria ou de quantidade de UMs devem ser apontadas
    como Disparidade mesmo quando a soma total de UST coincidir.
  redmine_100_percent_billed_criteria: >-
    Uma tarefa no Redmine só é considerada '100% Cobrada/Regular' quando atende
    cumulativamente a 3 requisitos: (1) Status Fechado/Concluído (Fechada,
    Resolvida, Validação ou Validação com Ressalvas); (2) Comentário/evidência
    formal contendo a descrição e o hash do commit (quando aplicável); e (3)
    Horas lançadas maiores que zero (spent_hours > 0). Se estiver fechada e com
    texto de cobrança mas tiver 0.0h lançadas, classificar como 'PENDENTE DE HORAS'.
  cast_13_2024_complexity_tiers_rule: >-
    No Catálogo Cast (13/2024), as atividades de desenvolvimento escalonadas por
    volume de unidades elementares possuem duas faixas no Redmine: (a) faixa
    '- 3 ou menos unidades' (Complexidade Altíssima = Não), que aplica o valor
    base de UST por UM (ex.: [backend] = 4 UST/UM, [backend-alteracao] = 2 UST/UM,
    [teste-unitario] = 4 UST/UM, [teste-unitario-alteracao] = 2 UST/UM,
    [frontend] = 4 UST/UM, [frontend-alteracao] = 1 UST/UM); e (b) faixa
    '- 4 ou mais unidades' (Complexidade Altíssima = Sim, aplicável quando a
    quantidade validada de UMs é >= 4 nas categorias que possuem escalonamento
    por volume CRUD/unidades), que dobra o multiplicador de UST por UM (2x base,
    ex.: [backend] passa de 4 para 8 UST/UM, totalizando 32 UST para 4 UMs).
    Sempre verificar se a faixa selecionada no campo 'Catálogo (Cast - 13/2024)'
    e o campo 'Complexidade Altíssima' condizem com a quantidade correta de UMs.
  unit_test_coverage_counting_rule: >-
    Em [teste-unitario] e [teste-unitario-alteracao], aplica-se a regra de
    '1 UM de teste por item/funcionalidade cobrada que o teste cobre' (o conceito
    de 'funcionalidade coberta' do catálogo aplicado à mesma contagem das
    unidades elementares do código). É vedado contar por classe de teste ou
    separar testes da mesma operação por camada arquitetural (ex.: ControllerTest,
    ServiceTest e RepositoryTest que testam a mesma rota/consulta de filtro
    contam juntos como 1 única UM). Ajustes em classes de apoio de teste,
    fixtures, mocks ou adaptação de testes existentes não contam UM à parte.
  same_delivery_cycle_no_double_alteration_rule: >-
    Regra da alteração dupla na mesma entrega: o que é modificado ou refatorado
    (ex.: adição de paginação, ajuste de assinatura/DTO) sobre código criado
    dias antes na mesma demanda-mãe e no mesmo ciclo de entrega — antes que a
    tarefa de criação tenha sido validada/homologada — faz parte da própria
    criação ([backend] / [frontend]) e NÃO pode ser cobrado separadamente como
    [backend-alteracao] ou [frontend-alteracao]. Indícios objetivos: (1) a
    subtarefa de alteração incide sobre métodos recém-criados em outra subtarefa
    da mesma demanda ainda não validada; (2) no commit do módulo base/common os
    métodos ditos 'alterados' surgem no diff já em sua versão final como métodos
    novos; (3) as horas da tarefa de alteração foram lançadas na mesma data do
    commit de criação. Nesses casos, recomendar zerar a tarefa de alteração
    (Status = Resolvida, Catálogo vazio, UM = 0) e consolidar as horas e o link
    do commit final na tarefa de criação (indicando alternativa apenas se houver
    comprovação formal de novo requisito solicitado após a entrega inicial).
  single_catalog_per_subtask_rule: >-
    Cada subtarefa do Redmine deve conter itens de um único código de catálogo.
    É vedado misturar na mesma subtarefa unidades de criação ([frontend] ou
    [backend]) com unidades de alteração ([frontend-alteracao] ou
    [backend-alteracao]). Quando uma entrega/nota contiver ambos, manter na
    subtarefa atual apenas as UMs da categoria principal e recomendar a abertura
    de uma subtarefa irmã (mesma demanda-mãe) para a outra categoria, dividindo
    as horas apontadas entre elas.
  lean_task_note_format_rule: >-
    Orientação dos Fiscais de Contrato (Sr. Edilson) para lançamento de tarefas
    no Redmine: as informações devem ser o mais enxutas possível. Formato padrão:
    Link do Commit no topo (*Commit*: <url>); cada Unidade Elementar em bloco
    individual (*Unidade elementar N*) separado por linha divisória (---); resumo
    objetivo do entregável (*Comportamento entregue*: <resumo>); caminho completo do
    arquivo com barras '/' (*Arquivo*: <caminho>); nome do método (*Método*: <metodo>);
    e para atividades de alteração ([*-alteracao]), inclusão obrigatória do número/intervalo
    de linhas (*Linhas*: X a Y). Para atividades de inclusão de novos arquivos/métodos,
    a indicação de linhas é opcional/dispensável para manter o registro enxuto.
  note_and_metadata_consistency_rule: >-
    Auditoria obrigatória de consistência formal: (1) Caminhos de arquivos
    citados na nota devem coincidir exatamente com o new_path do git diff (sem
    omitir pastas intermediárias e usando '/' em vez de '\'); (2) A nota deve
    seguir o padrão enxuto acordado com a fiscalização (orientação Sr. Edilson),
    contendo 1 seção 'Unidade elementar N' individualizada por cada UM cobrada no
    campo 'Unid. Medida (Cast)', indicando método, linhas (obrigatórias para alterações)
    e link do commit; (3) Código que injeta serviço simulado/mockado (ex.: *Simulado,
    *Mock) em vez da integração REST real não conclui a entrega de [frontend]/[backend]
    (manter 'Em andamento' até o commit com o serviço real); (4) O campo 'Sistema (Módulo)'
    deve condizer com o repositório do commit ('(Serviços)' para *-service/*-common
    e '(Mobile)' para *-mobile); e (5) A tag entre colchetes no título da tarefa
    deve coincidir com o item selecionado no campo 'Catálogo (Cast - 13/2024)'.
  evidence_classification_levels:
    EVIDENCIA_VERIFICADA: >-
      O entregável exigido no campo 'deliverable' foi integralmente comprovado
      nas fontes primárias (ex.: commit/diff compatível no GitLab ou documento/registro
      formal no Redmine) com vínculo inequívoco à tarefa.
    INFERENCIA_TECNICA: >-
      Existem indícios técnicos da execução (ex.: commits do mesmo autor e
      período afetando os módulos esperados, ou descrição parcial), mas falta
      vínculo formal explícito ou detalhamento completo da métrica multiplicadora.
    INFORMACAO_AUSENTE: >-
      O entregável obrigatório (Produto), o código-fonte no repositório, a
      métrica quantitativa (ex.: quantidade de CRUDs, critérios de aceitação,
      horas ou tabelas) ou a autorização prévia exigida não foram localizados.

crud_and_elementary_units_agreement:
  description: >-
    Entendimento formal acordado entre Economia e CAST sobre as definições de
    operações CRUD e Unidades Elementares referenciadas no catálogo, combinado
    com a taxonomia técnica de itens desconsiderados ([desconsiderado] — 0 UM).
  must_be_counted: >-
    Além das operações elementares CRUD principais, DEVEM SER CONTABILIZADAS
    quaisquer outras Operações/Ações/Unidades Elementares acessórias que
    agreguem valor ao negócio, que possuam coesão (responsabilidade única e bem
    definida) e que não sejam responsabilidade da Unidade Elementar CRUD
    principal em questão.
  cross_catalog_warning: >-
    CUIDADO: Essas operações acessórias que agregam valor ao negócio podem não
    ser do mesmo item de catálogo. Nestes casos, novas tarefas do Redmine devem
    ser criadas (ou propostas) e classificadas com o item de catálogo
    correspondente.
  must_not_be_counted:
    general_principle: >-
      NÃO DEVEM SER CONTABILIZADOS métodos auxiliares que não agreguem valor ao
      negócio, que correspondam apenas a fragmentações da implementação (quebra
      de um método coeso em partes, a critério do desenvolvedor) de uma única
      funcionalidade/unidade elementar, ou que se constituam apenas em
      elementos de código/arquiteturais obrigatórios para o correto
      funcionamento da operação/ação que está sendo entregue.
    explicit_exclusions:
      - "Getters;"
      - "Setters;"
      - "Métodos em diferentes camadas apenas com função de delegar a ação para outras camadas (Controller, Service, DAO);"
      - "Criações de classes .java cujas operações/ações já sejam contabilizadas;"
      - "Criações de arquivos .css e .xhtml (estrutura inicial da tela – incluso no catálogo tela);"
      - "Criações de arquivos .js (inclusos no catálogo do Frontend)."
  disregarded_code_patterns:
    - category: "Formatação e Reflow Puro ([desconsiderado] — 0 UM)"
      rule: >-
        Alterações restritas a espaços em branco, indentação, quebras de linha
        (reflow de assinatura ou instruções), concatenação de literais quebrados
        em linhas, linhas em branco, imports ou comentários.
    - category: "Boilerplate e Convenção de Linguagem ([desconsiderado] — 0 UM)"
      rule: >-
        Getters (get*, is* sem regra de negócio), setters (set*), toString,
        equals, hashCode, compareTo, canEqual, clone, valueOf, values,
        construtores simples de atribuição/injeção, DTOs/Projections puros e
        constantes simples em classes não-enum.
    - category: "Limpeza, Reset ou Inicialização Mecânica de Estado/UI ([desconsiderado] — 0 UM)"
      rule: >-
        Métodos/funções (ex.: limpaCampos, pararHeartbeat, reset, init, clear)
        cujo corpo realiza exclusivamente atribuição de valores vazios/escalares
        (null, 0, '', false, [], {}), limpeza de timers (clearInterval,
        clearTimeout) ou manipulação visual básica (val(''), hide(), show(),
        empty(), prop('disabled')) sem regra de negócio, sem chamada HTTP/AJAX
        e sem persistência.
    - category: "Delegação entre Camadas, Extração Interna e Null-Check Simples ([desconsiderado] — 0 UM)"
      rule: >-
        Métodos em Controller/Service/DAO que apenas repassam parâmetros para
        outra camada, fragmentação de método existente em submétodo privado ou
        sobrecarga ('trocar seis por meia-dúzia') e adição exclusiva de guarda
        simples de nulidade (if (x != null)) sem alteração da lógica de domínio.
    - category: "Diagnóstico e Log Puro ([desconsiderado] — 0 UM)"
      rule: >-
        Métodos ou alterações restritas exclusivamente a instruções de log
        (logger.*, console.*, System.out.*).
    - category: "Troca Exclusiva de Tipo de Coleção/Instanciação Local ([desconsiderado] — 0 UM)"
      rule: >-
        Substituição unicamente da classe de coleção/objeto instanciada em
        variável local (ex.: LinkedList<> para ConcurrentLinkedQueue<>) ou troca
        de DTO/mapper de retorno sem mudança na lógica da operação.
    - category: "Widgets/Componentes Visuais Puramente Estáticos, Gatilhos de 1 Linha e Serviços Simulados ([desconsiderado] — 0 UM)"
      rule: >-
        No Frontend/Mobile (Flutter, Web, etc.), NÃO contam UM: (1) funções
        gatilho de 1 linha (ex.: verMais, verMenos, aplicarFiltro, limparFiltro)
        que apenas delegam chamada ao método principal do controller; (2) páginas
        ou widgets que apenas disparam a carga inicial no initState e repassam
        callbacks, ou cards/cabeçalhos/botões puramente visuais de exibição e
        estilo sem lógica condicional própria (ex.: botões desativados, links de
        navegação simples); (3) modelos de dados (fromJson/toJson/copyWith/==),
        interfaces de serviço, mappers de URL/query params, módulos de injeção de
        dependência (DI/rotas); e (4) classes de serviço simuladas/mockadas
        (ex.: *ServiceSimulado) com dados fixos em memória.

sections:
  - id: "sessao-1"
    number: 1
    title: "SESSÃO 1 - ATIVIDADES DE DESIGN e UX"
    description: "Atividades relacionadas à elaboração de protótipos, wireframes e ativos visuais/vetoriais de interface."

  - id: "sessao-2"
    number: 2
    title: "SESSÃO 2 - ATIVIDADES DE ANÁLISE E PROJETO"
    description: "Atividades de gestão de backlog, modelagem de dados, cerimônias ágeis, especificação de histórias de usuário, planejamento, arquitetura e avaliação de squads."

  - id: "sessao-3"
    number: 3
    title: "SESSÃO 3 - ATIVIDADES DE DESENVOLVIMENTO E IMPLANTAÇÃO"
    description: "Atividades de codificação backend/frontend, testes unitários e funcionais, relatórios, análise de problemas, deploy, configuração de ambientes/componentes e scripts de banco."

  - id: "sessao-4"
    number: 4
    title: "SESSÃO 4 - ATIVIDADES DE SUPORTE E DOCUMENTAÇÃO"
    description: "Atividades de registro de demandas, suporte técnico, manuais, documentação auxiliar, pareceres técnicos, liberação de acessos, treinamentos e reuniões."

activities:
  # ===========================================================================
  # SESSÃO 1 - ATIVIDADES DE DESIGN e UX
  # ===========================================================================
  - id: "prototipo"
    tag: "[Protótipo]"
    tag_aliases:
      - "[Protótipo]"
      - "[Prototipo]"
      - "[prototipo]"
      - "[protótipo]"
    title: "Elaboração de protótipo ou wireframe"
    section_id: "sessao-1"
    description: >-
      Desenvolvimento de protótipo não funcional, exibindo como as informações
      devem estar organizadas, quais serão os componentes visuais, as cores, a
      tipografia e imagens que estarão dispostos em uma tela de sistema.
    professional_profile: "Time de Desenvolvimento"
    deliverable: "Protótipo de tela em arquivo no formato PDF. Outros formatos podem ser requeridos."
    unit_of_measure: "Por tela"
    ust:
      base_value: 4
      warranty_value: null
      raw_text: "4"
      calculation_type: "per_unit"
      block_size: null
      unit_parameter: "quantidade_telas"
      formula_description: "UST_total = 4 * quantidade_telas"
    complexity_rules:
      - level: "Alta"
        condition: "para telas com 10 a 15 itens de interação"
        metric: "itens_interacao_por_tela"
        threshold_description: "10 <= itens_interacao <= 15"
      - level: "Altíssima"
        condition: "para telas com mais de 15 itens de interação"
        metric: "itens_interacao_por_tela"
        threshold_description: "itens_interacao > 15"
    validation_guidelines:
      requires_git_evidence: "not_required"
      requires_prior_authorization: false
      is_exceptional: false
      primary_evidence_sources:
        - "redmine_attachment"
        - "redmine_issue"
      expected_artifacts:
        - "Arquivo de protótipo em formato PDF (ou outro formato requerido) anexado ou vinculado à tarefa"
        - "Identificação da quantidade de telas prototipadas"
      llm_audit_checklist:
        - "Verificar se o arquivo do protótipo (PDF ou formato requisitado) consta como entregável."
        - "Contabilizar o número de telas distintas efetivamente prototipadas."
        - "Caso seja alegada complexidade Alta ou Altíssima, verificar a contagem de itens de interação na tela (10-15 ou >15)."

  - id: "imagem"
    tag: "[Imagem]"
    tag_aliases:
      - "[Imagem]"
      - "[imagem]"
    title: "Elaboração de ícone ou imagem vetorial"
    section_id: "sessao-1"
    description: >-
      Produção de ícone ou imagem vetorial, com base nas especificações de
      formato e tamanho, elaborado a partir de fontes preexistentes livres de
      direitos autorais, ou de uso formalmente autorizado, ou por meio do
      design criativo.
    professional_profile: "Time de Desenvolvimento"
    deliverable: "Ícone ou imagem vetorial disponibilizadas nos formatos PNG, JPG e SVG."
    unit_of_measure: "Único"
    ust:
      base_value: 2
      warranty_value: null
      raw_text: "2"
      calculation_type: "fixed_unique"
      block_size: null
      unit_parameter: "entrega_unica"
      formula_description: "UST_total = 2 (valor fixo por entrega única da atividade)"
    complexity_rules: []
    validation_guidelines:
      requires_git_evidence: "when_applicable"
      requires_prior_authorization: false
      is_exceptional: false
      primary_evidence_sources:
        - "redmine_attachment"
        - "gitlab_commits_diffs"
      expected_artifacts:
        - "Arquivos de imagem/ícone disponibilizados nos formatos PNG, JPG e/ou SVG"
      llm_audit_checklist:
        - "Confirmar a entrega dos ativos nos formatos especificados (PNG, JPG, SVG) na issue ou incorporados ao repositório."
        - "Aplicar valor único de 2 UST conforme unidade de medida 'Único'."

  # ===========================================================================
  # SESSÃO 2 - ATIVIDADES DE ANÁLISE E PROJETO
  # ===========================================================================
  - id: "backlog"
    tag: "[Backlog]"
    tag_aliases:
      - "[Backlog]"
      - "[backlog]"
    title: "Backlog"
    section_id: "sessao-2"
    description: >-
      Com base nas informações iniciais de requisitos e funcionalidades
      levantadas pela atividade de análise, organizar e priorizar o backlog
      geral do produto. Ainda, com base no backlog do produto, organizar,
      priorizar e aprovar com o negócio as tarefas que serão desenvolvidas
      durante o sprint. Essa atividade é recorrente a cada ciclo iterativo
      conhecido como sprint.
    professional_profile: "Analista - Product Owner (PO)"
    deliverable: "Backlog do produto e da sprint organizado, priorizado e aprovado com a área de negócio (até 7 user-stories ou demandas de sustentação)."
    unit_of_measure: "Para até 7 user-stories ou demandas de sustentação."
    ust:
      base_value: 16
      warranty_value: null
      raw_text: "16"
      calculation_type: "per_block"
      block_size: 7
      unit_parameter: "bloco_ate_7_user_stories_ou_demandas"
      formula_description: "UST_total = 16 para até 7 user-stories ou demandas de sustentação organizadas/priorizadas na sprint"
    complexity_rules:
      - level: "Altíssima"
        condition: "para backlog contendo três ou mais atividades de user-story com mais de 10 critérios de aceitação cada."
        metric: "user_stories_com_mais_de_10_criterios"
        threshold_description: "quantidade_user_stories_com_mais_de_10_criterios >= 3"
    validation_guidelines:
      requires_git_evidence: "not_required"
      requires_prior_authorization: false
      is_exceptional: false
      primary_evidence_sources:
        - "redmine_issue"
      expected_artifacts:
        - "Registro no Redmine das user-stories ou demandas de sustentação priorizadas para a sprint"
        - "Evidência de aprovação/priorização junto ao negócio"
      llm_audit_checklist:
        - "Verificar se a atividade foi executada no contexto de planejamento/organização de ciclo iterativo (sprint)."
        - "Conferir a listagem de user-stories ou demandas de sustentação associadas."
        - "Para complexidade Altíssima, verificar se ao menos 3 user-stories possuem mais de 10 critérios de aceitação cada."

  - id: "modelo"
    tag: "[Modelo]"
    tag_aliases:
      - "[Modelo]"
      - "[modelo]"
    title: "Modelo de dados"
