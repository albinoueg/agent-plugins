  # SESSÃO 3 - ATIVIDADES DE DESENVOLVIMENTO E IMPLANTAÇÃO
  # ===========================================================================
  - id: "backend"
    tag: "[backend]"
    tag_aliases:
      - "[backend]"
      - "[Backend]"
      - "[back-end]"
    title: "Criação de funcionalidade no backend do sistema."
    section_id: "sessao-3"
    description: >-
      Envolve a criação completa da funcionalidade no lado servidor. Conforme
      entendimento acordado entre Economia e CAST, contabilizam-se as Unidades
      Elementares CRUD criadas, as Operações/Ações/Unidades Elementares
      acessórias que agreguem valor ao negócio e possuam coesão (responsabilidade
      única e bem definida, que não sejam responsabilidade da Unidade Elementar
      CRUD principal), além da regra de criação de Enum (1 UM por commit,
      independentemente se foram criados 1 ou 10 enums no mesmo commit).
    professional_profile: "Time de Desenvolvimento."
    deliverable: >-
      Código da implementação incorporado ao sistema e adicionado ao
      repositório, ou sistema de controle de versão.
    unit_of_measure: "Quantidade de operações CRUD / Unidades Elementares de negócio criadas (+ máximo 1 UM por commit para criação de Enums)."
    ust:
      base_value: 4
      high_complexity_value: 8
      warranty_value: 0
      raw_text: "4 (faixa '3 ou menos unidades') ou 8 (faixa '4 ou mais unidades')"
      calculation_type: "per_unit"
      block_size: null
      unit_parameter: "quantidade_unidades_elementares_backend_criadas"
      formula_description: "Se UM <= 3 (faixa '3 ou menos'): UST_total = 4 * UM. Se UM >= 4 (faixa '4 ou mais' / Complexidade Altíssima): UST_total = 8 * UM."
    complexity_rules:
      - level: "Altíssima"
        condition: "para atividades com 4 unidades elementares CRUD."
        metric: "unidades_elementares_crud"
        threshold_description: "quantidade_unidades_elementares >= 4"
    validation_guidelines:
      requires_git_evidence: "required"
      requires_prior_authorization: false
      is_exceptional: false
      primary_evidence_sources:
        - "gitlab_commits_diffs"
        - "redmine_issue"
      expected_artifacts:
        - "Commits e diffs no GitLab comprovando a criação de operações CRUD ou operações acessórias coesas que agregam valor ao negócio no servidor"
      llm_audit_checklist:
        - "Aplicar o entendimento acordado Economia/CAST: contabilizar Unidades Elementares CRUD principais e Operações/Ações acessórias coesas que agreguem valor ao negócio."
        - "FAIXA DE COMPLEXIDADE CAST 13/2024: Se UM <= 3, aplicar 4 UST/UM (faixa '3 ou menos unidades', Complexidade Altíssima = Não). Se UM >= 4, aplicar 8 UST/UM (faixa '4 ou mais unidades', Complexidade Altíssima = Sim)."
        - "ATENÇÃO: Caso uma operação acessória pertença a outro item de catálogo (ex.: [frontend], [Script], [Componente]), alertar que deve ser classificada em tarefa separada com o item de catálogo correspondente."
        - "REGRA DE ENUM: Se um mesmo commit criar 1, 2 ou 10 enums, contabilizar SOMENTE 1 UM no commit para o conjunto de enums criados."
        - "NÃO CONTABILIZAR (0 UM / [desconsiderado]): Getters, Setters, constantes de rota, interfaces, classes Documentable/Swagger, métodos em diferentes camadas apenas para delegar ação (Controller -> Service -> DAO), handlers de exceção que fazem parte da operação principal, criação de classes .java cujas ações já foram contabilizadas, fragmentação de método coeso em partes menores, formatação pura, logs puros ou criação de arquivos .css/.xhtml/.js."
        - "Conferir se o campo 'Sistema (Módulo)' está preenchido como '(Serviços)' e se todos os commits envolvidos (ex.: service + common) estão citados na nota."
        - "Verificar se a demanda não decorre de erro em garantia (custo = 0 UST)."

  - id: "backend-alteracao"
    tag: "[backend-alteracao]"
    tag_aliases:
      - "[backend-alteracao]"
      - "[backend-alteração]"
      - "[Backend-alteracao]"
    title: "Alteração ou reuso de funcionalidade no backend do sistema."
    section_id: "sessao-3"
    description: >-
      Envolve a alteração de funcionalidade no lado servidor ou o reuso de
      funcionalidade ou serviço similar no sistema. Segue o entendimento
      acordado entre Economia e CAST para Unidades Elementares CRUD e operações
      acessórias coesas de negócio, bem como a regra de alteração de Enum (1 UM
      por commit, independentemente se foram alterados 1 ou 10 enums no mesmo
      commit).
    professional_profile: "Time de Desenvolvimento."
    deliverable: >-
      Código da implementação incorporado ao sistema e adicionado ao
      repositório, ou sistema de controle de versão.
    unit_of_measure: "Quantidade de operações CRUD / Unidades elementares CRUD associadas (+ máximo 1 UM por commit para alteração de Enums)."
    ust:
      base_value: 2
      high_complexity_value: 4
      warranty_value: 0
      raw_text: "2 (faixa '3 ou menos unidades') ou 4 (faixa '4 ou mais unidades')"
      calculation_type: "per_unit"
      block_size: null
      unit_parameter: "quantidade_unidades_elementares_backend_alteradas"
      formula_description: "Se UM <= 3 (faixa '3 ou menos'): UST_total = 2 * UM. Se UM >= 4 (faixa '4 ou mais' / Complexidade Altíssima): UST_total = 4 * UM."
    complexity_rules:
      - level: "Altíssima"
        condition: "para atividades com 4 unidades elementares CRUD."
        metric: "unidades_elementares_crud"
        threshold_description: "quantidade_unidades_elementares >= 4"
    validation_guidelines:
      requires_git_evidence: "required"
      requires_prior_authorization: false
      is_exceptional: false
      primary_evidence_sources:
        - "gitlab_commits_diffs"
        - "redmine_issue"
      expected_artifacts:
        - "Commits e diffs no GitLab comprovando modificação ou reuso de operações CRUD ou unidades elementares coesas de negócio no servidor"
      llm_audit_checklist:
        - "Aplicar o entendimento acordado Economia/CAST: contabilizar apenas alterações/reusos em Unidades Elementares CRUD ou operações acessórias coesas que agreguem valor ao negócio."
        - "REGRA DA ALTERAÇÃO DUPLA NA MESMA ENTREGA: Verificar se os métodos ditos 'alterados' foram criados dias antes em outra subtarefa da mesma demanda-mãe ainda não validada, ou se no commit do módulo common eles já aparecem como métodos novos, ou se as horas estão lançadas na data do commit de criação. Caso positivo, recomendar zerar a tarefa (Catálogo vazio, UM = 0) pois alterações anteriores à entrega final fazem parte da criação."
        - "REGRA DE ENUM: Se um mesmo commit alterar 1, 2 ou 10 enums (ou várias constantes/métodos de enums), contabilizar SOMENTE 1 UM por commit."
        - "NÃO CONTABILIZAR (0 UM / [desconsiderado]): Getters, Setters, delegação pura entre camadas (Controller/Service/DAO), troca apenas do DTO/mapper de retorno, métodos citados na nota que não sofreram diff real no commit, extração interna de método ('trocar seis por meia-dúzia'), checagem simples de null, logs puros, formatação/reflow ou troca simples de tipo de coleção local."
        - "Conferir se a tag do título da tarefa é '[Backend-Alteração]' (e não '[Backend]') para evitar divergência com o campo Catálogo."
        - "Caso seja correção de defeito em período de garantia da contratada, aplicar regra de garantia (0 UST)."

